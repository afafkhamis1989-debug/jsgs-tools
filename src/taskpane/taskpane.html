<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>JSGS Tools</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:20px; font-family:"Segoe UI",sans-serif; background:linear-gradient(180deg,#ffffff,#eef2ff); color:#1e293b; }
.logo { width:140px; display:block; margin:0 auto 15px auto; }
.subtitle { text-align:center; color:#6366f1; font-size:12px; margin-bottom:20px; }
.card { background:white; border-radius:18px; padding:20px; box-shadow:0 8px 25px rgba(0,0,0,.08); }
.menu-btn { width:100%; padding:18px; margin-bottom:12px; border:none; border-radius:14px; cursor:pointer; color:white; font-size:14px; font-weight:600; background:linear-gradient(135deg,#6366f1,#06b6d4); text-align:left; }
input[type="text"], input[type="password"] { width:100%; padding:12px; border-radius:12px; border:1px solid #cbd5e1; margin-top:8px; font-size:13px; }
button { width:100%; padding:13px; margin-top:12px; border:none; border-radius:12px; cursor:pointer; font-weight:600; color:white; font-size:13px; background:linear-gradient(135deg,#6366f1,#06b6d4); }
.sheet-item { padding:10px; margin-bottom:8px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; }
.backBtn { background:#334155; margin-bottom:15px; }
.danger-btn { background:linear-gradient(135deg,#ef4444,#f97316); }
.success-btn { background:linear-gradient(135deg,#10b981,#06b6d4); }
hr { border:none; border-top:1px solid #e2e8f0; margin:12px 0; }
.result { margin-top:15px; text-align:center; }
.section-title { font-size:13px; font-weight:600; color:#475569; margin:12px 0 6px 0; }
.view { display:none; }
#homeView { display:block; }
.footer { text-align:center; margin-top:20px; color:#94a3b8; font-size:11px; line-height:1.6; }
.btn-row { display:flex; gap:8px; margin-top:12px; }
.btn-row button { margin-top:0; }
</style>
</head>
<body>

<div id="homeView" class="view" style="display:block">
  <img src="./logotrans.png" class="logo">
  <div class="subtitle">Smart Workflows • Intelligent Decisions</div>
  <div class="card">
    <button class="menu-btn" id="openExportToolBtn">📂 Export Sheets to ZIP</button>
    <button class="menu-btn" id="openLockToolBtn">🔒 Lock / Unlock Sheets</button>
    <button class="menu-btn" id="openMergeDataBtn">🔗 Merge Sheets Data</button>
    <button class="menu-btn" id="openMergeWorkbooksBtn">📋 Merge Workbooks</button>
  </div>
</div>

<div id="exportView" class="view">
  <button class="backBtn" id="backFromExport">← Back</button>
  <div class="card">
    <div class="section-title">ZIP File Name</div>
    <input id="projectName" type="text" placeholder="Final Exam">
    <button id="loadSheetsBtn">🔄 Load Sheets</button>
    <div style="margin-top:15px"><label><input type="checkbox" id="selectAll"> Select All</label></div>
    <hr>
    <div id="sheetList"></div>
    <button id="exportSheetsBtn">📂 Export Selected Sheets</button>
    <div id="exportResult" class="result"></div>
  </div>
</div>

<div id="lockView" class="view">
  <button class="backBtn" id="backFromLock">← Back</button>
  <div class="card">
    <div class="section-title">Password</div>
    <input id="lockPassword" type="password" placeholder="Enter password">
    <button id="loadSheetsLockBtn">🔄 Load Sheets</button>
    <div style="margin-top:15px"><label><input type="checkbox" id="selectAllLock"> Select All</label></div>
    <hr>
    <div id="sheetListLock"></div>
    <div class="btn-row">
      <button id="lockSheetsBtn">🔒 Lock Selected</button>
      <button id="unlockSheetsBtn" class="danger-btn">🔓 Unlock Selected</button>
    </div>
    <div id="lockResult" class="result"></div>
  </div>
</div>

<div id="mergeDataView" class="view">
  <button class="backBtn" id="backFromMergeData">← Back</button>
  <div class="card">
    <div class="section-title">Destination Sheet Name</div>
    <input id="mergeDestName" type="text" placeholder="Merged Data">
    <button id="loadSheetsMergeBtn">🔄 Load Sheets</button>
    <div style="margin-top:15px"><label><input type="checkbox" id="selectAllMerge"> Select All</label></div>
    <hr>
    <div id="sheetListMerge"></div>
    <div style="margin-top:12px"><label><input type="checkbox" id="skipHeadersMerge" checked> Skip headers (keep first sheet header only)</label></div>
    <button id="mergeSheetsDataBtn" class="success-btn">🔗 Merge Sheets Data</button>
    <div id="mergeDataResult" class="result"></div>
  </div>
</div>

<div id="mergeWorkbooksView" class="view">
  <button class="backBtn" id="backFromMergeWorkbooks">← Back</button>
  <div class="card">
    <div class="section-title">Select Excel Files to Merge</div>
    <input id="workbookFiles" type="file" accept=".xlsx,.xls" multiple style="margin-top:8px;width:100%;">
    <div class="section-title" style="margin-top:14px">Output Workbook Name</div>
    <input id="mergedWorkbookName" type="text" placeholder="Merged Workbook">
    <button id="mergeWorkbooksBtn" class="success-btn">📋 Merge Workbooks</button>
    <div id="mergeWorkbooksResult" class="result"></div>
  </div>
</div>

<div class="footer">JSGS Tools v1.1<br>© 2026</div>
<script src="taskpane.js"></script>
</body>
</html>
